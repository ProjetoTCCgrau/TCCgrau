<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Obscurium</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<!--parte do header junto com o perfil-->
  <header>
   <img src="img\logo_obscurium1.png" alt="Logo do site" class="logo">
  <!-- Perfil -->
<div id="perfilHeader" class="perfil-header">
    <div id="perfilFotoHeader" class="avatar-padrao">
        ♟
    </div>

    <span id="perfilNomeHeader"></span>
</div>
  <nav>
    <a href="index.html">Início</a>
    <a href="mapa_interativo/mapa.html">Mapa</a>
    <a href="ranking.html">Ranking</a>
    <a href="comentario.html">Comentário</a>
    <button id="btnTema" type="button" title="Alternar tema">Tema</button>
  </nav>
</header>

<main class="container">
  <section class="card">
    <h2> Contato </h2>
    <p>Deixe sua avaliação! Os campos com * são obrigatórios.</p>

    <form class="formulario" id="contactForm">
      <div class="campo">
        <label for="nome">Nome *</label> <br>
        <input id="nome" name="nome" type="text" required placeholder="Seu nome">
      </div>

      <div class="campo">
        <label for="preferido">Lenda Preferida</label> <br>
        <input id="preferido" name="preferido" type="text" placeholder="Título">
      </div>
<br>

      <div class="campo">
        <label for="coment">Comentário</label> <br>
        <textarea id="coment" name="coment" rows="4" placeholder="Deixe um comentário (opcional)"></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button type="submit" class="btn">Enviar</button>
        <button type="reset" class="btn">Limpar</button>
      </div>
    </form>

  </section>
</main>

<footer>
    <p>
      © 2026 — Obscurium • 
      <br>
      
    </p>
  </footer>


</body>
</html>
