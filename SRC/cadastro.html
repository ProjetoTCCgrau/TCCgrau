<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — Obscurium</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../BD/supabaseClient.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Header único e limpo -->
  <header>
    <img src="img/logo_obscurium1.png" alt="Logo Obscurium" class="logo">
    <nav>
      <a href="index.html">Início</a>
      <button id="btnTema" type="button" title="Alternar tema">Tema</button>
    </nav>
  </header>

  <main class="container">
    <section class="card" style="max-width: 400px; margin: 0 auto;">
      <h2>Crie sua conta</h2>
      <p>Junte-se à escuridão.</p>

      <form id="formCadastro" class="formulario">
        <div class="campo" style="margin-bottom:15px;">
          <label for="cadUser">Usuário</label>
          <input type="text" id="cadUser" required style="width:100%; padding:8px; border-radius:6px; border:none; margin-top:5px;">
        </div>

        <!-- Campo de E-mail adicionado -->
        <div class="campo" style="margin-bottom:15px;">
          <label for="cadEmail">E-mail</label>
          <input type="email" id="cadEmail" required style="width:100%; padding:8px; border-radius:6px; border:none; margin-top:5px;">
        </div>

        <div class="campo" style="margin-bottom:15px;">
          <label for="cadPass">Senha</label>
          <input type="password" id="cadPass" required style="width:100%; padding:8px; border-radius:6px; border:none; margin-top:5px;">
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>

      <p style="margin-top:15px; text-align:center;">
        Já tem conta? <a href="login.html" style="color:#e63946;">Entrar</a>
      </p>
    </section>
  </main>

  <footer>
    <p>© 2026 — Obscurium</p>
  </footer>

</body>
</html>
